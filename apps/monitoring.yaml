---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  sources:
    - chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 88.5.4
      helm:
        releaseName: kube-prometheus-stack
        values: |
          # Cilium replaces kube-proxy — these components are unreachable
          kubeProxy:
            enabled: false
          kubeControllerManager:
            enabled: true
          kubeScheduler:
            enabled: true
          grafana:
            # Temporary shutdown: Grafana has no HPA and is held at zero.
            replicas: 0
            autoscaling:
              enabled: false
            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              passwordKey: admin-password
            persistence:
              enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi
          prometheus:
            prometheusSpec:
              # Original: 1 replica. Restore to 1 when the shutdown ends.
              replicas: 0
              retention: 30d
              retentionSize: 5GiB
              storageSpec: {}
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          alertmanager:
            alertmanagerSpec:
              # Original: 1 replica. Restore to 1 when the shutdown ends.
              replicas: 0
              retention: 24h
              storage: {}
              # configSecret replaces the Helm-generated alertmanager config entirely.
              # ESO renders the full alertmanager.yaml from Infisical secrets.
              configSecret: alertmanager-config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          # Original: enabled with 1 replica. The subchart has no HPA.
          kube-state-metrics:
            replicas: 0
          # DaemonSets cannot be scaled with replicas; remove node-exporter
          # during the temporary shutdown so it creates no pods on cluster nodes.
          nodeExporter:
            enabled: false
    - chart: metrics-server
      repoURL: https://kubernetes-sigs.github.io/metrics-server/
      targetRevision: 3.14.0
      helm:
        releaseName: metrics-server
        values: |
          # Kubeadm kubelets do not request CA-signed serving certificates.
          args:
            - --kubelet-insecure-tls
          replicas: 1
    - repoURL: https://github.com/quniv/home-argocd.git
      targetRevision: HEAD
      path: manifests/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Validate=false permits the narrow SSA replica patch in manifests/monitoring.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Validate=false
