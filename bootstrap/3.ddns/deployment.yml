---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # checkov:skip=CKV_K8S_40:Image runs as root by default; 1000 is our chosen non-root UID, not image-defined
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-ddns
          image: timothyjmiller/cloudflare-ddns:2.2.0@sha256:97c7a833dc84c53067d239291799ac3e117614d3c384f87215e7974d2da0c22e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m
          livenessProbe:
            exec:
              command: [/bin/sh, -c, kill -0 1]
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command: [/bin/sh, -c, kill -0 1]
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: CONFIG_PATH
              value: /etc/cloudflare-ddns/
          volumeMounts:
            - mountPath: /etc/cloudflare-ddns
              name: config-cloudflare-ddns
              readOnly: true
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: config-cloudflare-ddns
          secret:
            secretName: config-cloudflare-ddns
        - name: tmp
          emptyDir: {}
